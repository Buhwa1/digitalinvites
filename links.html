<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Guest links</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEE9;--panel:#FFFFFF;--ink:#2E2420;--muted:#7A6A62;--line:#E3D8D0;--accent:#7A5534;--ok:#2F6B47;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1816;--panel:#26211E;--ink:#EFE7E1;--muted:#A99A91;--line:#3A322E;--accent:#D2A77C;--ok:#7FC79D}}
:root[data-theme="dark"]{--bg:#1C1816;--panel:#26211E;--ink:#EFE7E1;--muted:#A99A91;--line:#3A322E;--accent:#D2A77C;--ok:#7FC79D}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:2.2rem;line-height:1.1;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 24px}
label{display:block;font-size:.9rem;color:var(--muted);margin:18px 0 6px}
select,textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:150px;resize:vertical}
.designs{display:flex;gap:8px;flex-wrap:wrap}
.designs button{flex:1 1 140px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.designs button span{display:block;font-size:.85rem;color:var(--muted)}
.designs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{font:inherit;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ol{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px}
li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
li strong{font-weight:600}
li code{font-size:.82rem;color:var(--muted);word-break:break-all}
li .row{margin:0}
li .btn{padding:7px 12px;font-size:.9rem}
.copied{color:var(--ok)}
.empty{color:var(--muted);font-style:italic;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>Guest links</h1>
  <p class="lede">Paste your guest list, pick a design, then send each guest their own personalised link.</p>

  <label id="dl">Design</label>
  <div class="designs" role="group" aria-labelledby="dl">
    <button type="button" data-d="porcelain">Porcelain<span>Blush, embossed florals, gatefold doors</span></button>
    <button type="button" data-d="lubugo">Lubugo<span>Barkcloth, cream and gold, envelope</span></button>
    <button type="button" data-d="emerald">Emerald<span>Green velvet, art deco, gold ribbon</span></button>
  </div>

  <label for="guests">Guests, one per line</label>
  <textarea id="guests">Mr. & Mrs. Daniel Ssemanda
Grace Nakato
Dr. Patrick Okello & Family
Aunt Rose Namuli
Brian & Esther Mugisha</textarea>

  <label for="msg">Message sent with each link ({name} and {link} are filled in)</label>
  <textarea id="msg" style="min-height:90px">Dear {name}, Joe and Jane would love for you to celebrate their wedding with them. Tap to open your invitation: {link}</textarea>

  <div class="row">
    <button class="btn primary" type="button" id="make">Create links</button>
    <button class="btn" type="button" id="copyAll">Copy all links</button>
    <a class="btn" id="preview" target="_blank" rel="noopener">Preview design</a>
  </div>
  <ol id="out"></ol>
</main>
<script>
(function(){
  let design = 'porcelain';
  try { design = localStorage.getItem('design') || 'porcelain'; } catch(e){}
  const base = location.origin.startsWith('http') ? location.origin : 'https://your-site.vercel.app';
  const $ = id => document.getElementById(id);
  const btns = [...document.querySelectorAll('[data-d]')];
  function sync(){ btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.d === design)); $('preview').href = `${base}/${design}?guest=${encodeURIComponent('Grace Nakato')}`; }
  btns.forEach(b => b.addEventListener('click', () => { design = b.dataset.d; try{localStorage.setItem('design',design)}catch(e){}; sync(); make(); }));
  const linkFor = n => `${base}/${design}?guest=${encodeURIComponent(n)}`;
  const names = () => $('guests').value.split('\n').map(s => s.trim()).filter(Boolean);
  function make(){
    const out = $('out'); out.innerHTML = '';
    const list = names();
    if (!list.length){ out.innerHTML = '<p class="empty">Add at least one guest name above.</p>'; return; }
    list.forEach(n => {
      const link = linkFor(n), text = $('msg').value.replaceAll('{name}', n).replaceAll('{link}', link);
      const li = document.createElement('li');
      li.innerHTML = '<strong></strong><code></code><div class="row"><button class="btn" type="button">Copy message</button><a class="btn" target="_blank" rel="noopener">Send on WhatsApp</a><a class="btn" target="_blank" rel="noopener">Open</a></div>';
      li.querySelector('strong').textContent = n; li.querySelector('code').textContent = link;
      const [copy, wa, open] = li.querySelectorAll('.btn');
      wa.href = 'https://wa.me/?text=' + encodeURIComponent(text); open.href = link;
      copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(text); copy.textContent = 'Copied'; copy.classList.add('copied'); } catch(e){ copy.textContent = 'Copy failed'; } });
      out.appendChild(li);
    });
  }
  $('make').addEventListener('click', make);
  $('copyAll').addEventListener('click', async e => {
    const t = names().map(n => `${n}: ${linkFor(n)}`).join('\n');
    try { await navigator.clipboard.writeText(t); e.target.textContent = 'Copied all'; } catch(err){ e.target.textContent = 'Copy failed'; }
  });
  sync(); make();
})();
</script>
</body>
</html>
